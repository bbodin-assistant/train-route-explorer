<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Train Route Explorer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="app-header">
        <div>
          <p class="eyebrow">GTFS route timelines</p>
          <h1>Train Route Explorer</h1>
          <a class="case-study-link" href="./strategy.html">Read the build strategy <span aria-hidden="true">↗</span></a>
        </div>
        <div id="cache-status" class="status idle">
          <span id="cache-status-text">Waiting for GTFS archive.</span>
          <progress id="cache-progress" max="100" value="0"></progress>
        </div>
      </header>

      <section class="source-panel">
        <div class="server-source">
          <span>Server GTFS archive</span>
          <button id="load-bundled">Download GTFS from server</button>
        </div>
        <div>
          <label for="gtfs-upload">Upload GTFS zip</label>
          <div class="inline-control">
            <input id="gtfs-upload" type="file" accept=".zip,application/zip" />
            <button id="load-upload">Load upload</button>
          </div>
        </div>
      </section>

      <section id="route-config-controls" class="config-panel">
        <fieldset class="station-picker" data-role="local_origins">
          <legend>Side A stations</legend>
          <input class="station-filter" type="search" placeholder="Filter stations" data-role="local_origins" />
          <div id="config-local-origins" class="station-checklist"></div>
        </fieldset>
        <fieldset class="station-picker" data-role="connection_stations">
          <legend>Transfer stations</legend>
          <input class="station-filter" type="search" placeholder="Filter stations" data-role="connection_stations" />
          <div id="config-connection-stations" class="station-checklist"></div>
        </fieldset>
        <fieldset class="station-picker" data-role="side_b_destinations">
          <legend>Side B stations</legend>
          <input class="station-filter" type="search" placeholder="Filter stations" data-role="side_b_destinations" />
          <div id="config-side-b-destinations" class="station-checklist"></div>
        </fieldset>
        <fieldset class="option-picker" data-role="train_types">
          <legend>Train types</legend>
          <input id="train-type-filter" class="option-filter" type="search" placeholder="Filter train types" />
          <div id="config-train-types" class="option-checklist"></div>
        </fieldset>
      </section>

      <section class="time-config-panel">
        <div class="day-control">
          <label for="day-calendar">Day</label>
          <div class="day-input-row">
            <input id="day-calendar" type="date" disabled />
            <button id="today-button" type="button" disabled>Today</button>
          </div>
        </div>
        <label>
          Minimum transfer time
          <input id="config-min-transfer" type="number" min="0" step="1" />
        </label>
        <label>
          Maximum transfer time
          <input id="config-max-transfer" type="number" min="0" step="1" />
        </label>
        <label>
          Maximum transfers
          <input id="config-max-transfer-count" type="number" min="0" step="1" />
        </label>
        <label>
          Maximum journey duration
          <input id="config-max-duration" type="number" min="0" step="1" />
        </label>
      </section>

      <section id="dashboard-controls" class="dashboard-controls">
        <fieldset class="option-picker highlights-picker" data-role="highlights">
          <legend>Highlights</legend>
          <input id="highlight-filter" class="option-filter" type="search" placeholder="Filter highlights" />
          <div id="highlight-stations" class="option-checklist compact"></div>
        </fieldset>
      </section>

      <section class="route-list-tabs">
        <div id="route-direction-tabs" class="tab-buttons">
          <button data-tab="out" class="selected">A-B</button>
          <button data-tab="back">B-A</button>
        </div>
        <section id="routes-time-chart" class="timeline">
          Load a GTFS archive to build routes.
        </section>
      </section>
    </main>

    <div id="train-detail-dismiss-layer" hidden></div>
    <aside id="train-detail-frame" hidden></aside>

    <script type="module" src="./app.js"></script>
  </body>
</html>

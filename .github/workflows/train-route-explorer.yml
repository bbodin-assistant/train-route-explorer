name: Train Route Explorer

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Download SNCF GTFS archive
        run: make fetch-gtfs

      - name: Build static site
        run: make build

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up ChromeDriver
        uses: browser-actions/setup-chromedriver@v1

      - name: Install Selenium
        run: python3 -m pip install -r tests/requirements.txt

      - name: Test station filters with Selenium
        env:
          TEST_URL: http://127.0.0.1:8080/
          SELENIUM_WAIT_SECONDS: "180"
        run: |
          python3 -m http.server 8080 --directory dist >/tmp/train-route-explorer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 tests/test_station_filter_selenium.py

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-route-explorer-dist
          path: dist

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: train-route-explorer-dist
          path: dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

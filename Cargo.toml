[package]
name = "train_route_explorer"
version = "0.1.0"
edition = "2021"
description = "Client-side GTFS route timeline explorer."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
csv = "1.3"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
